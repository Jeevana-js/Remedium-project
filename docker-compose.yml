services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:80
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/.env:ro
      - ./backend/app/db:/app/app/db
      # Shares the host's Claude Code login into the container so the claude
      # CLI subprocess (app/connectors/claude_cli.py) can authenticate without
      # a separate ANTHROPIC_API_KEY. Read-only; every /resolve call runs as
      # this Claude Code identity and consumes from its usage/quota.
      - ~/.claude/.credentials.json:/root/.claude/.credentials.json:ro
      - ~/.claude.json:/root/.claude.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
